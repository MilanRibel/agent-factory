# Local hooks that mirror CI checks; CI stays the gate. tests/test_pre_commit_config.py
# checks that every rev is a full commit SHA with a tag comment, and that gitleaks
# has the version and flags of the secret-scan job in .github/workflows/ci.yml.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      # Built from source on this rev with the local Go toolchain.
      - id: gitleaks
        args: [--redact, --ignore-gitleaks-allow]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
